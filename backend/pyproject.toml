[project]
name = "ai-cockpit-backend"
version = "0.1.0"
description = "Personal AI Cockpit - FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.0.0",
    "certifi>=2024.8.30",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "httpcore==1.0.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "pyyaml>=6.0.1",
    "pillow>=11.0.0",
    "jsonschema>=4.23.0",
    "sse-starlette>=2.1.0",
    "websockets>=15.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "openai-codex==0.155.1",
    "tzdata>=2025.2",
    "qrcode==8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
notifications = [
    "pywebpush>=2.0.0",
]
benchmark = [
    "jsonschema>=4.23.0",
]
codex-probe = [
    "openai-codex==0.155.1",
]

[tool.pytest.ini_options]
markers = [
    "browser: external production browser/build acceptance, required by M10",
    "diagnostic: optional performance experiment, outside required contract acceptance",
    "provider: billed provider integration; dedicated gates select their own provider seams",
]
