[project]
name = "ai-cockpit-backend"
version = "0.1.0"
description = "Personal AI Cockpit - FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.0.0",
    "certifi>=2024.8.30",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "httpcore==1.0.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "pyyaml>=6.0.1",
    "pillow>=11.0.0",
    "jsonschema>=4.23.0",
    "sse-starlette>=2.1.0",
    "websockets>=15.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "openai-codex==0.155.1",
    "tzdata>=2025.2",
    "qrcode==8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.17.3",
]
notifications = [
    "pywebpush>=2.0.0",
]
codex-probe = [
    "openai-codex==0.155.1",
]

[tool.pytest.ini_options]
# data/ holds runtime state (including third-party plugin checkouts with their own
# tests); only the project suite may be collected.
testpaths = ["tests"]
# Each test has its own database and folder, so the suite runs in parallel
# (about 2-3 minutes instead of 9). Pass -n 0 to debug serially.
addopts = "-n 8 --dist worksteal"
norecursedirs = ["data", ".cockpit", ".venv", "node_modules"]
# A stuck test must fail with a stack dump instead of hanging the run; the slowest
# tests take well under a minute.
timeout = 300
markers = [
    "browser: external production browser/build acceptance, required by the release gate",
    "diagnostic: optional performance experiment, outside required contract acceptance",
    "provider: billed provider integration; dedicated gates select their own provider seams",
]

[tool.ruff]
# Correctness only for now (undefined names, unused imports/variables, syntax
# errors); widen the rule set deliberately rather than by default upgrades.
src = ["app"]
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# The codebase deliberately uses compact one-line statements.
ignore = ["E701", "E702"]

[tool.pyright]
# Basic mode on the seams the phase-4 refactor creates; the scope widens as
# modules move into feature packages. Not a whole-repo gate.
include = ["app/services/tasks"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
