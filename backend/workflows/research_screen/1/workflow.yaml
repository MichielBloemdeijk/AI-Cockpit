schema: workflow-definition.v2
id: research_screen
version: 1
purpose: Give a concise sourced explanation of the subject visible on screen.
routing_examples:
  - Research what is shown here and explain it briefly.
  - Find sources explaining this screen's subject.
instructions: instructions.md
input_schema: screen-request.v2
output_schema: document.v1
required_initial_context: [screen_images]
capabilities:
  - task.context.read@1
  - task.context.images@2
  - research.native@1
  - task.question.ask@1
  - task.result.publish@1
  - task.finish@1
defaults:
  execution_profile: fast
fixtures: fixtures/cases.yaml

tools:
  remove: [native.local, native.subagents, native.skills]
