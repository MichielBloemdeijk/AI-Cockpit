<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documents</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; line-height: 1.6; }
    body { margin: 0; padding: 16px; background: #09090b; color: #e4e4e7; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 8px; color: #fafafa; }
    input[type=search] { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #3f3f46; background: #18181b; color: inherit; font: inherit; }
    ul.cards { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; }
    ul.cards button { width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid #27272a;
      background: #18181b; color: inherit; font: inherit; cursor: pointer; }
    ul.cards button:hover { border-color: #52525b; }
    .card-title { display: block; font-weight: 600; color: #fafafa; }
    .meta { color: #a1a1aa; font-size: .9rem; }
    .summary { color: #a1a1aa; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 16px; }
    .quiet { background: transparent; border: 0; color: #a1a1aa; font: inherit; padding: 6px 0; cursor: pointer; }
    .quiet:hover { color: #e4e4e7; }
    .danger:hover { color: #f87171; }
    #body { overflow-wrap: anywhere; }
    #body h1, #body h2, #body h3, #body h4 { color: #fafafa; line-height: 1.3; margin: 24px 0 8px; }
    #body h1 { font-size: 1.4rem; } #body h2 { font-size: 1.2rem; } #body h3, #body h4 { font-size: 1.05rem; }
    #body pre { background: #18181b; border: 1px solid #27272a; border-radius: 8px; padding: 12px; overflow-x: auto; }
    #body code { font-family: ui-monospace, monospace; font-size: .9em; }
    #body :not(pre) > code { background: #27272a; padding: 1px 5px; border-radius: 4px; }
    #body blockquote { margin: 12px 0; padding-left: 12px; border-left: 3px solid #3f3f46; color: #a1a1aa; }
    #body table { border-collapse: collapse; display: block; overflow-x: auto; }
    #body th, #body td { border: 1px solid #3f3f46; padding: 6px 10px; text-align: left; }
    #body hr { border: 0; border-top: 1px solid #3f3f46; margin: 20px 0; }
    a { color: #38bdf8; }
    h2.sources { font-size: 1.1rem; margin: 28px 0 8px; color: #fafafa; }
    #status { color: #f87171; margin: 0 0 12px; }
    #status:empty { display: none; }
    #sources { padding-left: 22px; }
    .empty { color: #71717a; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <p id="status" role="status"></p>
    <section id="list-view">
      <input id="search" type="search" placeholder="Search documents" aria-label="Search documents">
      <ul id="documents" class="cards"></ul>
      <p id="empty" class="empty" hidden>No documents yet. Ask Jarvis to explain or research something on your screen.</p>
    </section>
    <article id="document-view" hidden>
      <div class="bar">
        <button id="back" class="quiet" type="button">&larr; All documents</button>
        <button id="delete" class="quiet danger" type="button">Delete</button>
      </div>
      <h1 id="title"></h1>
      <p id="summary" class="summary" hidden></p>
      <div id="body"></div>
      <section id="sources-section" hidden>
        <h2 class="sources">Sources</h2>
        <ul id="sources"></ul>
      </section>
    </article>
  </main>
  <script src="/api/app-host/_sdk/cockpit-app.js"></script>
  <script>
    const COLLECTION = "document";
    const $ = (id) => document.getElementById(id);
    let documents = [];
    let current = null;

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function safeUrl(value) {
      try {
        const url = new URL(value);
        return (url.protocol === "https:" || url.protocol === "http:") && !url.username && !url.password ? url.href : null;
      } catch { return null; }
    }

    function link(text, href) {
      const url = safeUrl(href);
      if (!url) return null;
      const node = document.createElement("a");
      node.href = url;
      node.target = "_blank";
      node.rel = "noopener noreferrer";
      node.append(inline(text));
      return node;
    }

    // Markdown, rendered into DOM nodes only: text never becomes HTML.
    const INLINE = [
      { pattern: /`([^`]+)`/, make: (m) => element("code", m[1]) },
      { pattern: /\[([^\]]+)\]\((\S+?)(?:\s+"[^"]*")?\)/, make: (m) => link(m[1], m[2]) || document.createTextNode(m[1]) },
      { pattern: /\*\*(.+?)\*\*|__(.+?)__/, make: (m) => wrap("strong", m[1] ?? m[2]) },
      { pattern: /\*([^*\s](?:[^*]*[^*\s])?)\*|(?<![\w])_([^_\s](?:[^_]*[^_\s])?)_(?![\w])/, make: (m) => wrap("em", m[1] ?? m[2]) },
      { pattern: /<?(https?:\/\/[^\s<>()]+[^\s<>().,;:!?])>?/, make: (m) => link(m[1], m[1]) || document.createTextNode(m[0]) },
    ];

    function wrap(tag, text) {
      const node = document.createElement(tag);
      node.append(inline(text));
      return node;
    }

    function inline(text) {
      const fragment = document.createDocumentFragment();
      let rest = text;
      while (rest) {
        let best = null;
        for (const rule of INLINE) {
          const match = rule.pattern.exec(rest);
          if (match && (!best || match.index < best.match.index)) best = { rule, match };
        }
        if (!best) { fragment.append(rest); break; }
        if (best.match.index) fragment.append(rest.slice(0, best.match.index));
        fragment.append(best.rule.make(best.match));
        rest = rest.slice(best.match.index + best.match[0].length);
      }
      return fragment;
    }

    const LIST_ITEM = /^\s*(?:([-*+])|(\d+)[.)])\s+(.*)$/;
    const TABLE_DIVIDER = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/;

    function cells(line) {
      return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
    }

    function markdown(source) {
      const lines = source.replace(/\r\n?/g, "\n").split("\n");
      const fragment = document.createDocumentFragment();
      let index = 0;
      while (index < lines.length) {
        const line = lines[index];
        if (!line.trim()) { index++; continue; }
        const fence = line.match(/^\s*(```|~~~)/);
        if (fence) {
          const code = [];
          index++;
          while (index < lines.length && !lines[index].trim().startsWith(fence[1])) code.push(lines[index++]);
          index++;
          const pre = element("pre");
          pre.append(element("code", code.join("\n")));
          fragment.append(pre);
          continue;
        }
        const heading = line.match(/^\s*(#{1,6})\s+(.*?)\s*#*\s*$/);
        if (heading) {
          fragment.append(wrap(`h${Math.min(heading[1].length + 1, 4)}`, heading[2]));
          index++;
          continue;
        }
        if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { fragment.append(element("hr")); index++; continue; }
        if (/^\s*>/.test(line)) {
          const quoted = [];
          while (index < lines.length && /^\s*>/.test(lines[index])) quoted.push(lines[index++].replace(/^\s*>\s?/, ""));
          const quote = element("blockquote");
          quote.append(markdown(quoted.join("\n")));
          fragment.append(quote);
          continue;
        }
        if (line.includes("|") && index + 1 < lines.length && TABLE_DIVIDER.test(lines[index + 1])) {
          const table = element("table");
          const head = element("tr");
          cells(line).forEach((cell) => head.append(wrap("th", cell)));
          const thead = element("thead");
          thead.append(head);
          const tbody = element("tbody");
          index += 2;
          while (index < lines.length && lines[index].includes("|") && lines[index].trim()) {
            const row = element("tr");
            cells(lines[index++]).forEach((cell) => row.append(wrap("td", cell)));
            tbody.append(row);
          }
          table.append(thead, tbody);
          fragment.append(table);
          continue;
        }
        const first = line.match(LIST_ITEM);
        if (first) {
          const list = element(first[1] ? "ul" : "ol");
          if (!first[1] && first[2] !== "1") list.start = Number(first[2]);
          let item = null;
          while (index < lines.length && lines[index].trim()) {
            const match = lines[index].match(LIST_ITEM);
            if (match) {
              item = wrap("li", match[3]);
              list.append(item);
            } else if (item && /^\s+/.test(lines[index])) {
              item.append(" ", inline(lines[index].trim()));
            } else break;
            index++;
          }
          fragment.append(list);
          continue;
        }
        const paragraph = [];
        while (index < lines.length && lines[index].trim() && !LIST_ITEM.test(lines[index])
               && !/^\s*(#{1,6}\s|>|```|~~~)/.test(lines[index])) paragraph.push(lines[index++].trim());
        fragment.append(wrap("p", paragraph.join(" ")));
      }
      return fragment;
    }

    // A body that opens with the document's own title as a heading would show it twice.
    function withoutRepeatedTitle(body, title) {
      const plain = (text) => text.replace(/^#+\s*/, "").trim().toLowerCase();
      const lines = body.split("\n");
      const first = lines.findIndex((line) => line.trim());
      if (first >= 0 && /^\s*#{1,6}\s/.test(lines[first]) && plain(lines[first].trim()) === plain(title)) {
        lines.splice(first, 1);
      }
      return lines.join("\n");
    }

    function renderList() {
      const term = $("search").value.trim().toLowerCase();
      const shown = documents.filter(({ value }) => !term || value.title.toLowerCase().includes(term)
        || (value.summary || "").toLowerCase().includes(term));
      $("documents").replaceChildren(...shown.map((record) => {
        const button = element("button");
        button.type = "button";
        button.append(element("span", record.value.title, "card-title"));
        if (record.value.summary) button.append(element("span", record.value.summary, "meta"));
        button.onclick = () => open(record.key);
        const item = element("li");
        item.append(button);
        return item;
      }));
      $("empty").hidden = documents.length > 0;
    }

    function renderDocument(record) {
      const value = record.value;
      $("title").textContent = value.title;
      $("summary").hidden = !value.summary;
      $("summary").textContent = value.summary || "";
      $("body").replaceChildren(markdown(withoutRepeatedTitle(value.body, value.title)));
      const sources = value.sources || [];
      $("sources-section").hidden = sources.length === 0;
      $("sources").replaceChildren(...sources.map((source) => {
        const item = element("li");
        item.append(link(source.label, source.url) || source.label);
        return item;
      }));
    }

    function show(view) {
      $("list-view").hidden = view !== "list";
      $("document-view").hidden = view !== "document";
      window.scrollTo(0, 0);
    }

    async function showList() {
      current = null;
      documents = await cockpit.data.query(COLLECTION, { order: "-updated_at", limit: 200 });
      renderList();
      show("list");
    }

    async function open(key) {
      $("status").textContent = "";
      const record = await cockpit.data.get(COLLECTION, key);
      if (!record) {
        $("status").textContent = "That document was deleted.";
        await showList();
        return;
      }
      current = record;
      renderDocument(record);
      show("document");
      cockpit.viewing(COLLECTION, key);
    }

    async function openTarget(target) {
      if (target && target.collection === COLLECTION && target.key) await open(target.key);
      else await showList();
    }

    $("search").addEventListener("input", renderList);
    $("back").onclick = () => showList();
    $("delete").onclick = async () => {
      if (!current || !confirm(`Delete "${current.value.title}"?`)) return;
      try {
        await cockpit.data.delete(COLLECTION, current.key, { expectedRevision: current.revision });
      } catch (error) {
        $("status").textContent = error.status === 409 ? "That document changed meanwhile; showing the latest." : error.message;
        await open(current.key);
        return;
      }
      await showList();
    };
    cockpit.onTarget((target) => openTarget(target));
    cockpit.ready.then(({ target }) => openTarget(target));
  </script>
</body>
</html>
